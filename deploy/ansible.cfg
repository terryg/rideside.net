[defaults]
# Keep collections inside the project venv rather than ~/.ansible/collections,
# so the deploy environment is self-contained and reproducible. Relative to the
# directory ansible runs from, which is deploy/ (see the Makefile).
#
# This is the default venv location. The Makefile exports
# ANSIBLE_COLLECTIONS_PATH, which takes precedence, so an overridden VENV stays
# in sync; this value covers running ansible by hand.
collections_path = ../_venv/collections
